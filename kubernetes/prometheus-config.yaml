apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: 'self-healing-telemetry'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['self-healing-service:5000']

  alert.rules.yml: |
    groups:
      - name: self-healing-alerts
        rules:
          - alert: AppHighFailureRate
            expr: increase(app_failures_total[1m]) > 0
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "High failure rate detected on app!"
              description: "The application is returning HTTP 500 errors."
